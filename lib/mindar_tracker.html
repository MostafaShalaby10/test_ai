<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <style>
    body { margin:0; padding:0; overflow:hidden; background:transparent; }
    video { opacity:0.01!important; position:fixed!important; width:1px!important; height:1px!important; }
  </style>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const mindFileUrl = params.get('mindFile') || 'targets.mind';
  const maxTrack = parseInt(params.get('maxTrack') || '3');

  console.log('[MINDAR.JS] Init: mindFile=' + mindFileUrl + ' maxTrack=' + maxTrack);

  function sendToFlutter(eventName, data) {
    const payload = JSON.stringify({ event: eventName, ...data });
    console.log('[MINDAR.JS] Sending to Flutter: ' + payload);
    try { if (window.flutter_inappwebview) { window.flutter_inappwebview.callHandler(eventName, data); return; } } catch(e) {}
    try { if (window.MarkerChannel) { window.MarkerChannel.postMessage(payload); return; } } catch(e) {}
    console.log('[MINDAR.JS] No Flutter channel available');
  }

  let mindarController = null;
  let isRunning = false;
  const visibleMarkers = new Set();
  const lastDetectionTime = {};
  const COOLDOWN_MS = 3000;

  async function startTracking() {
    console.log('[MINDAR.JS] Loading .mind file...');
    try {
      mindarController = new window.MINDAR.IMAGE.MindARThree({
        container: document.body,
        imageTargetSrc: mindFileUrl,
        maxTrack: maxTrack,
        filterMinCF: 0.001,
        filterBeta: 10,
      });
      console.log('[MINDAR.JS] MindAR controller created. Starting...');
      await mindarController.start();
      isRunning = true;
      console.log('[MINDAR.JS] ✓ Tracking active');

      for (let i = 0; i < maxTrack; i++) {
        const anchor = mindarController.addAnchor(i);
        anchor.onTargetFound = () => {
          const now = Date.now();
          console.log('[MINDAR.JS] TARGET FOUND #' + i + ' (cooldown check: ' + (lastDetectionTime[i] ? (now - lastDetectionTime[i]) + 'ms since last' : 'first time') + ')');
          if (lastDetectionTime[i] && (now - lastDetectionTime[i]) < COOLDOWN_MS) {
            console.log('[MINDAR.JS] Skipped #' + i + ' (cooldown)');
            return;
          }
          lastDetectionTime[i] = now;
          visibleMarkers.add(i);
          sendToFlutter('onMarkerDetected', { targetIndex: i, timestamp: now });
        };
        anchor.onTargetLost = () => {
          visibleMarkers.delete(i);
          console.log('[MINDAR.JS] TARGET LOST #' + i + ' visible=[' + Array.from(visibleMarkers).join(',') + ']');
          sendToFlutter('onMarkerLost', { targetIndex: i });
        };
        anchor.onTargetUpdate = () => {};
        console.log('[MINDAR.JS] Anchor #' + i + ' registered');
      }
    } catch (err) {
      console.error('[MINDAR.JS] ERROR: ' + err.message);
      sendToFlutter('onError', { message: err.message });
    }
  }

  function stopTracking() { if (mindarController && isRunning) { mindarController.stop(); isRunning=false; console.log('[MINDAR.JS] Stopped'); } }
  function pauseTracking() { if (mindarController && isRunning) { mindarController.stop(); isRunning=false; console.log('[MINDAR.JS] Paused'); } }
  function resumeTracking() { if (mindarController && !isRunning) { mindarController.start(); isRunning=true; console.log('[MINDAR.JS] Resumed'); } }

  window.addEventListener('load', () => { console.log('[MINDAR.JS] Page loaded, starting...'); startTracking(); });
</script>
</body>
</html>
